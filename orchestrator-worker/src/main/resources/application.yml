server:
  port: 8081

spring:
  application:
    name: orchestrator-worker
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 5
        max-concurrency: 20
        acknowledge-mode: manual

worker:
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
  webhook-signing-secret: ${WEBHOOK_SIGNING_SECRET:super-secret-hmac-key-change-in-prod}
  max-concurrent-per-domain: 10

redisson:
  singleServerConfig:
    address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
    password: ${REDIS_PASSWORD:null}

