server:
  port: ${PORT:8080}

spring:
  application:
    name: orchestrator-coordinator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

redisson:
  singleServerConfig:
    address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
    password: ${REDIS_PASSWORD:null}

scheduler:
  leader-lock-key: ${LEADER_LOCK_KEY:scheduler:leader:lock}
  leader-lock-lease-sec: ${LEADER_LOCK_LEASE_SEC:15}
  poll-interval-ms: ${POLL_INTERVAL_MS:5000}
  webhook-signing-secret: ${WEBHOOK_SIGNING_SECRET}
