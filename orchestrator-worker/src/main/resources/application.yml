server:
  port: 8081

spring:
  application:
    name: orchestrator-worker
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 20
        acknowledge-mode: manual

worker:
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
  webhook-signing-secret: ${WEBHOOK_SIGNING_SECRET:super-secret-hmac-key-change-in-prod}
  max-concurrent-per-domain: 10

redisson:
  singleServerConfig:
    address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
    password: ${REDIS_PASSWORD:null}

