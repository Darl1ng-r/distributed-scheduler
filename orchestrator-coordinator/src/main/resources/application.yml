server:
  port: 8080

spring:
  application:
    name: orchestrator-coordinator
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

redisson:
  singleServerConfig:
    address: "redis://127.0.0.1:6379"

scheduler:
  leader-lock-key: "scheduler:leader:lock"
  leader-lock-lease-sec: 15
  poll-interval-ms: 5000
  webhook-signing-secret: "super-secret-hmac-key-change-in-prod"
